<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>【管理者】データ一覧＆カード印刷画面</title>
  <style>
    body { font-family: sans-serif; display: flex; margin: 0; height: 100vh; background: #f0f2f5; }
    /* 左側：スタッフ一覧エリア */
    .sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; padding: 16px; }
    .list-item { padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; cursor: pointer; background: #fafafa; font-size: 0.9rem; }
    .list-item:hover, .list-item.active { background: #e3f2fd; border-color: #2196f3; }
    .btn-reload { width: 100%; padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 12px; }

    /* 右側：メインエリア */
    .main { flex: 1; padding: 20px; overflow-y: auto; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .controls { width: 280px; padding: 16px; background: #fff; border: 1px solid #ccc; border-radius: 8px; }
    .preview-area { flex-grow: 1; }
    canvas { border: 1px solid #999; background-color: #f9f9f9; max-width: 100%; }
    input { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; }
    .btn-print { width: 100%; padding: 12px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    /* 全項目確認テーブル */
    .detail-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; font-size: 0.9rem; }
    .detail-table th, .detail-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .detail-table th { width: 220px; background: #f8f9fa; }

    @media print {
      body * { visibility: hidden; }
      #previewCanvas, #previewCanvas * { visibility: visible; }
      #previewCanvas { position: absolute; left: 0; top: 0; }
    }
  </style>
</head>
<body>

  <!-- 左側：スプレッドシートから取得した一覧 -->
  <div class="sidebar">
    <button class="btn-reload" onclick="loadData()">🔄 最新データを読み込む</button>
    <div id="user-list">読み込み中...</div>
  </div>

  <!-- 右側：微調整・プレビュー・詳細データ -->
  <div class="main">
    <h2 style="margin-top:0;">カードプレビュー・微調整画面</h2>
    <div class="container">
      <div class="controls">
        <h3 style="margin-top:0;">文字内容の調整</h3>
        <label>スタッフ名:</label>
        <input type="text" id="editStaff" value="サンプルスタッフ" oninput="drawCanvas()">

        <label>推しの名前:</label>
        <input type="text" id="editOshi" value="サンプル推し" oninput="drawCanvas()">

        <label>プロフタイプ:</label>
        <input type="text" id="editType" value="サンプルタイプ" oninput="drawCanvas()">

        <button class="btn-print" onclick="window.print()">この画像を印刷する</button>
      </div>

      <div class="preview-area">
        <canvas id="previewCanvas" width="600" height="400"></canvas>
      </div>
    </div>

    <!-- 選択した人の全回答内容 -->
    <div id="all-answers"></div>
  </div>

  <script>
    // ★ここにGASのウェブアプリURLを貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw86vQY8KqhNnzgH1I0dFV01qHceyWDajWKkuKWfHtU3t6Wt_aQsf0bL_k6xptbBROY/exec";

    const typeNames = {
      1: "ノーマルタイプ",
      2: "現地遠征タイプ",
      3: "日常をともにタイプ",
      4: "ものであふれるタイプ",
      5: "情報収集タイプ",
      6: "周りの人と交流タイプ"
    };

    let allRecords = [];
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');

    async function loadData() {
      const listEl = document.getElementById('user-list');
      listEl.innerHTML = "読み込み中...";
      try {
        const res = await fetch(GAS_URL);
        allRecords = await res.json();
        renderList();
      } catch (e) {
        listEl.innerHTML = "データの取得に失敗しました。GASのURLを確認してください。";
      }
    }

    function renderList() {
      const listEl = document.getElementById('user-list');
      if (allRecords.length === 0) {
        listEl.innerHTML = "まだデータがありません。";
        return;
      }
      listEl.innerHTML = allRecords.map((item, idx) => `
        <div class="list-item" onclick="selectRecord(${idx}, this)">
          <strong>${item['スタッフ名'] || '名称未設定'}</strong><br>
          <small>タイプ${item['プロフタイプ']} / 端末ID: ${item['端末ID']}</small><br>
          <small style="color:#666;">${item['日時']}</small>
        </div>
      `).join('');
    }

    function selectRecord(idx, el) {
      document.querySelectorAll('.list-item').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      const item = allRecords[idx];

      // プレビュー用の入力欄に自動セットして再描画
      document.getElementById('editStaff').value = item['スタッフ名'] || '';
      document.getElementById('editOshi').value = item['推しの名前'] || '';
      document.getElementById('editType').value = typeNames[item['プロフタイプ']] || item['プロフタイプ'] || '';
      drawCanvas();

      // 下部に全16項目の回答一覧を表示
      const keys = [
        "日時", "端末ID", "プロフタイプ", "スタッフ名", "年齢", "性別", "推しの名前",
        "推しを知ったきっかけ", "推しの好きなところ", "推し活のスタイル",
        "推し活での幸せ・大切にしていること", "質問１", "質問２", "質問３", "質問４", "フリースペース"
      ];
      const rowsHtml = keys.map(k => `<tr><th>${k}</th><td>${item[k] || ''}</td></tr>`).join('');
      document.getElementById('all-answers').innerHTML = `<h3>回答データ詳細</h3><table class="detail-table">${rowsHtml}</table>`;
    }

    function drawCanvas() {
      ctx.fillStyle = "#f0f4f8";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 4;
      ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

      ctx.fillStyle = "#333333";
      ctx.font = "bold 24px sans-serif";
      ctx.fillText("スタッフ名:", 40, 80);
      ctx.font = "24px sans-serif";
      ctx.fillText(document.getElementById('editStaff').value, 180, 80);

      ctx.font = "bold 24px sans-serif";
      ctx.fillText("推しの名前:", 40, 150);
      ctx.font = "24px sans-serif";
      ctx.fillText(document.getElementById('editOshi').value, 180, 150);

      ctx.font = "bold 24px sans-serif";
      ctx.fillText("プロフタイプ:", 40, 220);
      ctx.font = "24px sans-serif";
      ctx.fillText(document.getElementById('editType').value, 200, 220);
    }

    window.onload = function() {
      drawCanvas();
      if (GAS_URL.startsWith("http")) {
        loadData();
      }
    };
  </script>
</body>
</html>
